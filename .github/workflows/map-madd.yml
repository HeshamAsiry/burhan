name: Build Madd knowledge map

on:
  push:
    paths:
      - ".github/madd-map.trigger"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Supabase upsert batch size"
        required: false
        default: "500"

jobs:
  map-madd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Madd map
        run: npm run map:madd
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAJWEED_MAP_BATCH_SIZE: ${{ inputs.batch_size }}
