name: Run Burhan Itqan API self-test

on:
  push:
    paths:
      - ".github/workflows/run-burhan-itqan-self-test.yml"
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Burhan API
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BURHAN_API_KEY: self-test-only-key
      - name: Start Burhan API
        run: |
          nohup npm start > /tmp/burhan-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              break
            fi
            sleep 2
          done
          test -s /tmp/health.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BURHAN_API_KEY: self-test-only-key
      - name: Generate Burhan Al-Itqan style test
        run: |
          set -o pipefail
          curl --fail-with-body -sS \
            -X POST \
            http://127.0.0.1:3000/api/v1/tests/generate \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $BURHAN_API_KEY" \
            --data '{
              "juz": 30,
              "style": "burhan_itqan",
              "test_number": 3,
              "question_count": 10,
              "persist": false,
              "includeAnswers": true
            }' | tee api-response.json
          node -e "const x=require('./api-response.json'); if(x.style!=='burhan_itqan'||x.test_number!==3||!x.questions||x.questions.length!==10) process.exit(1); console.log('Generated questions:', x.questions.length); console.log(x.questions.map(q=>({type:q.question_type,prompt:q.prompt})));"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BURHAN_API_KEY: self-test-only-key
      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: burhan-itqan-api-self-test-response
          path: |
            api-response.json
            /tmp/burhan-api.log
