name: Debug Quran phoneme mappings

on:
  push:
    branches: [main]

jobs:
  debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/debug-phoneme-mappings.py
