name: Debug Quran phoneme mappings

on:
  push:
    branches: [main]

jobs:
  debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Run mapping diagnostic
        run: python scripts/debug-phoneme-mappings.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PHONEME_REFERENCE_BATCH_SIZE: "50"
