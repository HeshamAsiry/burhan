name: Publish IqraEval Inference Image

on:
  push:
    branches: ["main"]
    paths:
      - "inference/iqraeval/**"
      - ".github/workflows/publish-iqraeval-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heshamasiry/burhan-iqraeval

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: inference/iqraeval
          file: inference/iqraeval/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/heshamasiry/burhan-iqraeval:main
            ghcr.io/heshamasiry/burhan-iqraeval:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
