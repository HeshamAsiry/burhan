name: Import Quran data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/quran-uthmani.xml"
      - "data/quran-data.xml"
      - "scripts/import-tanzil.mjs"
      - "package.json"

jobs:
  import-quran:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Quran
        run: npm run import:quran
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
