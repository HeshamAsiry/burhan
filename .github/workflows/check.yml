name: Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run check:madd
      - run: npm run check:madd-phoneme-alignment
      - run: npm run check:madd-phoneme-reference-map
      - run: npm run check:madd-evaluator
      - run: npm run check:phoneme-evidence
      - run: npm run check:phoneme-provider-contract
      - run: npm run check:phoneme-timing-quality
      - run: npm run check:provider-fetch
      - run: npm run check:teacher-review
      - run: npm run build
