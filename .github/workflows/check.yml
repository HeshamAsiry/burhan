name: Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate IqraEval inference service syntax
        run: python3 -m py_compile inference/iqraeval/main.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run check:madd
      - run: npm run check:madd-phoneme-alignment
      - run: npm run check:madd-phoneme-reference-map
      - run: npm run check:madd-evaluator
      - run: npm run check:phoneme-evidence
      - run: npm run check:phoneme-provider-contract
      - run: npm run check:phoneme-provider-acceptance
      - run: npm run check:phoneme-timing-quality
      - run: npm run check:phoneme-scheme
      - run: npm run check:provider-fetch
      - run: npm run check:teacher-review
      - run: npm run check:tajweed-analysis-route
      - run: npm run check:audio-upload-route
      - run: npm run build

      - name: Create temporary API key for runtime verification
        run: echo "BURHAN_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run the actual Burhan API generator
        run: |
          nohup npm start > /tmp/burhan-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl --fail-with-body -sS             -X POST             http://127.0.0.1:3000/api/v1/tests/generate             -H "Content-Type: application/json"             -H "x-burhan-api-key: $BURHAN_API_KEY"             --data '{
              "juz": 30,
              "level": 4,
              "test_type": "custom",
              "persist": true,
              "questions": [
                {
                  "type": "mutashabihat",
                  "anchor": "فبأي آلاء ربكما تكذبان",
                  "occurrences_required": 2,
                  "ayahs_after": 1,
                  "threshold": 0.45,
                  "limit": 10
                },
                {
                  "type": "recite_range",
                  "start": {
                    "surah_id": 90,
                    "ayah_number": 1
                  },
                  "end": {
                    "surah_id": 90,
                    "ayah_number": 5
                  }
                },
                {
                  "type": "mcq",
                  "surah_id": 92,
                  "ayah_number": 1
                }
              ]
            }'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload runtime log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burhan-api-runtime-log
          path: /tmp/burhan-api.log
