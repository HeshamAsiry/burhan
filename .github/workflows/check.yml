name: Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run check:madd
      - run: npm run check:madd-phoneme-alignment
      - run: npm run check:madd-phoneme-reference-map
      - run: npm run check:madd-evaluator
      - run: npm run check:phoneme-evidence
      - run: npm run check:phoneme-provider-contract
      - run: npm run check:phoneme-provider-acceptance
      - run: npm run check:phoneme-timing-quality
      - run: npm run check:provider-fetch
      - run: npm run check:teacher-review
      - run: npm run check:tajweed-analysis-route
      - run: npm run check:audio-upload-route
      - run: npm run build

      - name: Run real audio calibration
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          audio_path="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep '^calibration/audio/' | grep -Ei '\.(wav|mp3|m4a|ogg|webm|flac)$' | tail -n 1 || true)"
          if [[ -z "${audio_path}" ]]; then
            audio_path="$(find calibration/audio -maxdepth 1 -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.ogg' -o -iname '*.webm' -o -iname '*.flac' \) | sort | head -n 1)"
          fi

          if [[ -z "${audio_path}" || ! -f "${audio_path}" ]]; then
            echo "No calibration audio found; skipping."
            exit 0
          fi

          export AUDIO_PATH="${audio_path}"

          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          audio_path = os.environ["AUDIO_PATH"]

          audio_url = (
              f"https://raw.githubusercontent.com/{repo}/{sha}/"
              f"{urllib.parse.quote(audio_path, safe='/')}"
          )

          payload = {
              "audio_url": audio_url,
              "reference_phonemes": [],
              "question_id": "b0000000-0000-4000-8000-000000000002",
              "madd_targets": [],
          }

          req = urllib.request.Request(
              "https://burhan-phonemizer.vercel.app/api/phonemize",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as res:
                  body = res.read().decode("utf-8", errors="replace")
                  with open("calibration-result.json", "w", encoding="utf-8") as f:
                      f.write(body)
                  parsed = json.loads(body)
                  print("Provider HTTP:", res.status)
                  print("Provider:", parsed.get("provider"))
                  print("Model:", parsed.get("model"))
                  print("Confidence:", parsed.get("confidence"))
                  print("Predicted phonemes:", len(parsed.get("predicted_phonemes", [])))
                  print("Timing entries:", len(parsed.get("phoneme_timings", [])))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              with open("calibration-result.json", "w", encoding="utf-8") as f:
                  f.write(body)
              print("Provider HTTP:", exc.code)
              print(body[:4000])
              raise SystemExit(1)
          PY

      - name: Upload real audio calibration result
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: burhan-real-audio-calibration-${{ github.run_id }}
          path: calibration-result.json
          if-no-files-found: ignore
