name: Real Audio Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - "calibration/audio/**"

jobs:
  model-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install audio/model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers soundfile sentencepiece

      - name: Select calibration audio
        id: audio
        shell: bash
        run: |
          set -euo pipefail
          audio_path="$(find calibration/audio -maxdepth 1 -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.ogg' -o -iname '*.webm' -o -iname '*.flac' \) | sort | head -n 1)"

          if [[ -z "${audio_path}" ]]; then
            echo "No calibration audio found."
            exit 1
          fi

          echo "path=${audio_path}" >> "$GITHUB_OUTPUT"
          echo "Selected: ${audio_path}"

      - name: Run real Quran phoneme model
        env:
          AUDIO_PATH: ${{ steps.audio.outputs.path }}
          BURHAN_CALIBRATION_MODEL: FatimahEmadEldin/wav2vec2-xls-r-300m-iqraeval
        run: |
          set -euo pipefail
          python scripts/run-real-audio-hf.py "$AUDIO_PATH"

      - name: Upload calibration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burhan-real-audio-model-calibration-${{ github.run_id }}
          path: calibration-result.json
          if-no-files-found: ignore
