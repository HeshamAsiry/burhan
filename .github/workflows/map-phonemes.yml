name: Build Quran phoneme references

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of phoneme references written per batch"
        required: false
        default: "50"

jobs:
  map-phonemes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Quran phoneme references
        run: python scripts/build-phoneme-references.py
        env:
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PHONEME_REFERENCE_BATCH_SIZE: \${{ inputs.batch_size }}
